name: 準備給審查 AI 的指示
description: >
  組出給審查 AI（只讀程式碼、對照驗收條件）的提示詞。review.yml 的 review job
  在找出上次審查版本之後、呼叫 Claude／agy 之前跑。

inputs:
  base_sha:
    description: PR 的 base commit SHA
    required: true
  head_sha:
    description: PR 的 head commit SHA
    required: true
  prev_desc:
    description: 上次審查版本的描述（review-find-prev-version 的輸出）
    default: ""
  records_files:
    description: PR 不能改的紀錄檔（空白分隔、完整路徑）
    default: ""
  records_exempt_prefix:
    description: 這個開頭的分支可以改紀錄檔
    default: ""
  review_instructions:
    description: 專案自己的審查說明，加在審查提示詞後面
    default: ""

outputs:
  text:
    description: 組好的審查提示詞
    value: ${{ steps.review_prompt.outputs.text }}

runs:
  using: composite
  steps:
    - id: review_prompt
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ inputs.base_sha }}
        HEAD_SHA: ${{ inputs.head_sha }}
        PREV_DESC: ${{ inputs.prev_desc }}
        RECORDS_FILES: ${{ inputs.records_files }}
        RECORDS_EXEMPT: ${{ inputs.records_exempt_prefix }}
        PROJECT: ${{ inputs.review_instructions }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        node << 'EOF'
        const fs = require('fs');
        const {
          PR_NUMBER, BASE_SHA, HEAD_SHA, PREV_DESC,
          RECORDS_FILES, RECORDS_EXEMPT, PROJECT,
          GITHUB_REPOSITORY, GITHUB_OUTPUT
        } = process.env;

        const whole = `git -C pr-head diff ${BASE_SHA}...${HEAD_SHA}`;
        let prompt = `You are the "reviewer" role: read code only, do not modify code, do not run tests. REPO: ${GITHUB_REPOSITORY}, PR: #${PR_NUMBER}
        The PR code is in the \`pr-head/\` directory; the AGENTS.md in the current directory (base branch) is authoritative.
        Language: write inline comments and the summary in Traditional Chinese (繁體中文).

        ${PREV_DESC}

        1. Read the PR description with \`gh pr view\` and the acceptance criteria with \`gh issue view\`.
        2. Inspect the changes (with \`${whole}\` or the re-review diff) and check them against each acceptance criterion.
        3. Tag each problem as【高】/【中】/【低】and leave inline comments with mcp__github_inline_comment__create_inline_comment.
        4. Put the overall review in the summary field; do not post an overall review comment on the PR yourself.
        5. Verdict, one of: pass (no problems at 中 or above), changes (problems at 中 or above), suspicious (security or malicious risk found).

        Tool limits: use Read, Grep, Glob to read and search files. Bash only allows \`git -C pr-head <diff|log|show|status|blame|ls-files|ls-tree|rev-parse|merge-base|cat-file>\`, \`gh pr <view|diff|checks>\`, \`gh issue view\`, \`ls\`, \`cat\`, \`head\`, \`tail\`, \`wc\`, \`grep\` (always use \`git -C pr-head\` for git, never \`cd\`). When a command is denied by permissions, do not retry it in a different form; use the tools listed above instead.
        `;

        if (RECORDS_FILES) {
          prompt += `\nThe PR must not modify these protected files: ${RECORDS_FILES}${RECORDS_EXEMPT ? ` (except on ${RECORDS_EXEMPT} branches)` : ''}.\n`;
        }
        if (PROJECT) prompt += `\nProject review instructions:\n${PROJECT}\n`;

        const delim = `AI_REVIEW_EOF_${Date.now()}`;
        fs.appendFileSync(GITHUB_OUTPUT, `text<<${delim}\n${prompt}\n${delim}\n`);
        EOF
