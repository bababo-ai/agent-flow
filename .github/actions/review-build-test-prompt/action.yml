name: 準備給測試 AI 的指示
description: >
  組出給測試 AI（實際操作驗證、不改程式）的提示詞，附上測試環境狀態、冒煙測試與
  CI 單元測試結果。review.yml 的 review job 在等到 CI 結果之後跑。

inputs:
  started:
    description: 測試環境是否啟動（test_setup 的 outputs.started）
    default: "false"
  setup_outcome:
    description: 建立測試環境步驟的 outcome
    default: ""
  setup_desc:
    description: 建立測試環境步驟的補充說明（test_setup 的 outputs.desc）
    default: ""
  test_prompt_file:
    description: 給測試 AI 的工具說明（Markdown 檔路徑）
    default: ""
  smoke_result:
    description: 冒煙測試結果
    default: ""
  ci_workflow:
    description: 單元測試看哪個 CI workflow 的結果；有值才會在提示詞提到
    default: ""
  unit_result:
    description: 單元測試結論
    default: ""
  unit_url:
    description: 單元測試 CI run 網址
    default: ""

outputs:
  text:
    description: 組好的測試提示詞
    value: ${{ steps.test_prompt.outputs.text }}

runs:
  using: composite
  steps:
    - id: test_prompt
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        STARTED: ${{ inputs.started }}
        SETUP_OUTCOME: ${{ inputs.setup_outcome }}
        SETUP_DESC: ${{ inputs.setup_desc }}
        PROMPT_FILE: ${{ inputs.test_prompt_file }}
        SMOKE_RESULT: ${{ inputs.smoke_result }}
        CI_WORKFLOW: ${{ inputs.ci_workflow }}
        UNIT_RESULT: ${{ inputs.unit_result }}
        UNIT_URL: ${{ inputs.unit_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        node << 'EOF'
        const fs = require('fs');
        const {
          PR_NUMBER, STARTED, SETUP_OUTCOME, SETUP_DESC,
          PROMPT_FILE, SMOKE_RESULT, CI_WORKFLOW, UNIT_RESULT, UNIT_URL,
          GITHUB_REPOSITORY, GITHUB_OUTPUT
        } = process.env;

        let prompt = `You are the "tester" role: verify by actually operating the system, do not modify code. REPO: ${GITHUB_REPOSITORY}, PR: #${PR_NUMBER}
        Test environment started: ${STARTED || 'false'} (setup script outcome: ${SETUP_OUTCOME}).
        ${SETUP_DESC || ''}
        Language: write the summary in Traditional Chinese (繁體中文).
        `;

        if (PROMPT_FILE && fs.existsSync(PROMPT_FILE)) prompt += `\nTest tools and instructions:\n${fs.readFileSync(PROMPT_FILE, 'utf-8')}\n`;
        if (SMOKE_RESULT && SMOKE_RESULT !== 'none') prompt += `\nSmoke test result: ${SMOKE_RESULT}.\n`;
        if (CI_WORKFLOW) prompt += `\nCI unit test result: ${UNIT_RESULT || 'none'} (link: ${UNIT_URL || 'none'}).\n`;

        prompt += `
        1. Read the acceptance criteria and verify each one by actually operating the tools.
        2. On a failure, rerun once to confirm, and include the command and its output.
        3. Write the report in the summary field. Verdict: pass, fail, incomplete.

        Tool limits: use Read, Grep, Glob to read and search files. Bash only allows the test tools listed in the instructions above, plus \`git -C pr-head <diff|log|show|status>\`, \`gh pr <view|diff|checks>\`, \`gh issue view\`, \`ls\`, \`cat\`, \`head\`, \`tail\`, \`wc\`, \`grep\`. When a command is denied by permissions, do not retry it in a different form. Do not install tools, language runtimes or system packages yourself; the test environment was prepared before you started. If a tool is missing or a required tool is denied so you cannot verify, set the verdict to incomplete and list the missing tools and the full denied commands in the summary.
        `;

        const delim = `AI_TEST_EOF_${Date.now()}`;
        fs.appendFileSync(GITHUB_OUTPUT, `text<<${delim}\n${prompt}\n${delim}\n`);
        EOF
