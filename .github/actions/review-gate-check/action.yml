name: 審查前置檢查與設定
description: >
  判斷 PR 是不是外部 Fork、commit 是否帶 [skip ci]、PR 目前狀態是否 OPEN，
  並比對變更檔案是否碰到受保護檔案或不可改的紀錄檔。review.yml 的 review job 最先跑。

inputs:
  github_token:
    description: 查 commit／PR／變更檔案用的 GitHub token
    required: true
  blocked_pattern:
    description: 固定檢查擋下的檔案（正規表示式，比對 PR 改到的檔案路徑）
    default: ""
  blocked_extra:
    description: 另外要擋的檔案（接在 blocked_pattern 後面）
    default: ""
  records_files:
    description: PR 不能改的紀錄檔（空白分隔、完整路徑）
    default: ""
  records_base:
    description: 紀錄檔檢查只看開到這個分支的 PR
    default: develop
  records_exempt_prefix:
    description: 這個開頭的分支（例如發版分支）可以改紀錄檔
    default: ""

outputs:
  skip:
    description: "true 表示不審查、不測試、不通知（fork 或使用者加了 [skip ci]）"
    value: ${{ steps.gate.outputs.skip }}
  closed:
    description: "true 表示 PR 已經 MERGED 或 CLOSED"
    value: ${{ steps.gate.outputs.closed }}
  blocked_files:
    description: 碰到受保護檔案時的檔案清單（空白分隔）
    value: ${{ steps.gate.outputs.blocked_files }}
  records_bad:
    description: 碰到不可改紀錄檔時的檔案清單（空白分隔）
    value: ${{ steps.gate.outputs.records_bad }}
  guard_done:
    description: "true 表示固定檢查都跑完、沒有中途結束"
    value: ${{ steps.gate.outputs.guard_done }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SENDER_TYPE: ${{ github.event.sender.type }}
        SENDER: ${{ github.event.sender.login }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        BLOCKED_PATTERN: ${{ inputs.blocked_pattern }}
        BLOCKED_EXTRA: ${{ inputs.blocked_extra }}
        RECORDS_FILES: ${{ inputs.records_files }}
        RECORDS_BASE: ${{ inputs.records_base }}
        RECORDS_EXEMPT: ${{ inputs.records_exempt_prefix }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        node << 'EOF'
        const fs = require('fs');
        const { execFileSync } = require('child_process');

        const {
          GH_TOKEN, SENDER_TYPE, SENDER, HEAD_SHA, HEAD_REPO, PR_NUMBER,
          BASE_REF, HEAD_REF, BLOCKED_PATTERN, BLOCKED_EXTRA,
          RECORDS_FILES, RECORDS_BASE, RECORDS_EXEMPT,
          GITHUB_REPOSITORY, GITHUB_OUTPUT
        } = process.env;

        function setOutput(key, value) {
          fs.appendFileSync(GITHUB_OUTPUT, `${key}=${value}\n`);
        }

        function runGh(args) {
          try {
            return execFileSync('gh', args, { encoding: 'utf-8', env: { ...process.env, GH_TOKEN } }).trim();
          } catch (err) { return ''; }
        }

        // 1. 檢查是否為外部 Fork PR
        if (HEAD_REPO !== GITHUB_REPOSITORY) {
          setOutput('skip', 'true');
          console.log(`::notice::PR 來自 ${HEAD_REPO || 'fork'}，非本倉庫分支：不審查、不測試、不通知`);
          process.exit(0);
        }

        // 2. 檢查 commit 訊息是否包含 [skip ci]
        const commitMsg = runGh(['api', `repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}`, '-q', '.commit.message']);
        if (/\[(skip ci|ci skip|no ci|skip actions|actions skip)\]/i.test(commitMsg)) {
          if (SENDER_TYPE === 'User') {
            setOutput('skip', 'true');
            console.log(`::notice::${SENDER} 的 commit 帶有 [skip ci]，不審查、不測試、不通知`);
            process.exit(0);
          } else {
            console.log(`::warning::commit 帶有 [skip ci]，但推送者非一般使用者，照常審查`);
          }
        }

        // 3. 檢查 PR 當前狀態
        const prState = runGh(['pr', 'view', PR_NUMBER, '-R', GITHUB_REPOSITORY, '--json', 'state', '-q', '.state']);
        console.log(`PR #${PR_NUMBER} 狀態：${prState || '（查不到）'}`);
        if (prState === 'MERGED' || prState === 'CLOSED') {
          setOutput('closed', 'true');
          console.log(`::notice::PR #${PR_NUMBER} 已是 ${prState}，不審查、不測試`);
          process.exit(0);
        } else if (prState !== 'OPEN') {
          console.error(`::error::查不到 PR #${PR_NUMBER} 狀態，終止流程`);
          process.exit(1);
        }

        // 4. 比對變更檔案與受保護檔案
        let fileList = [];
        try {
          const raw = runGh(['api', `repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files`, '--paginate']);
          const parsed = JSON.parse(raw || '[]');
          for (const item of parsed) {
            if (item.filename) fileList.push(item.filename);
            if (item.previous_filename) fileList.push(item.previous_filename);
          }
        } catch (e) {
          console.error('讀取變更檔案失敗:', e.message);
          process.exit(1);
        }

        const uniqueFiles = Array.from(new Set(fileList));
        let patternStr = (BLOCKED_PATTERN || '').trim();
        const extraStr = (BLOCKED_EXTRA || '').trim();
        if (extraStr) patternStr = patternStr ? `${patternStr}|${extraStr}` : extraStr;

        let blockedFiles = [];
        if (patternStr) {
          const regex = new RegExp(patternStr, 'i');
          blockedFiles = uniqueFiles.filter(f => regex.test(f)).sort();
        }
        const blockedStr = blockedFiles.join(' ');
        setOutput('blocked_files', blockedStr);

        const recList = (RECORDS_FILES || '').trim().split(/\s+/).filter(Boolean);
        let recordsBad = [];
        const isExempt = RECORDS_EXEMPT && HEAD_REF.startsWith(RECORDS_EXEMPT);
        if (recList.length > 0 && BASE_REF === RECORDS_BASE && !isExempt) {
          recordsBad = uniqueFiles.filter(f => recList.includes(f)).sort();
        }
        const recordsBadStr = recordsBad.join(' ');
        setOutput('records_bad', recordsBadStr);

        // 固定檢查（fork／skip-ci／PR 狀態／受保護檔案／紀錄檔）都跑完沒有中途結束，才算完成
        setOutput('guard_done', 'true');
        EOF
