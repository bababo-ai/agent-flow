name: AI Dev (Shared)

on:
  workflow_call:
    inputs:
      pr_number:
        description: 審查叫醒修改時的 PR 編號（呼叫端把自己 workflow_dispatch 的 inputs.pr_number 傳進來）
        type: string
        default: ""
      round:
        description: 第幾輪修改（同上）
        type: string
        default: ""
      base_branch:
        description: PR 開到哪個分支
        type: string
        default: develop
      branch_prefix:
        description: 開發分支名稱的開頭，後面接 issue 編號與英文簡述
        type: string
        default: ai/issue-
      runs_on:
        description: 預設跑在哪裡（JSON），若 provider 為 agy 則由 agy_runs_on 決定，也可傳入指定的值
        type: string
        default: '"ubuntu-latest"'
      agy_runs_on:
        description: 當使用 agy 時跑在哪裡（JSON），需為安裝並登入 agy 的 self-hosted runner
        type: string
        default: '["self-hosted"]'
      setup_command:
        description: Claude 啟動前執行的指令（裝套件等）。Claude 的指令有隔離，在 Linux 上刪不掉 node_modules，自己跑 npm ci 會失敗，所以要在這裡先裝好
        type: string
        default: ""
      extra_env:
        description: 額外的環境變數，一行一個 KEY=VALUE（例如建置需要的假 DATABASE_URL），不要放機密
        type: string
        default: ""
      allowed_tools:
        description: 額外放行給開發 Claude 的工具，逗號分隔，例如 Bash(npm run build),Bash(npm test)
        type: string
        default: ""
      project_instructions:
        description: 專案自己的開發說明（建置與測試指令、變更記錄寫法等），加在三種提示詞後面
        type: string
        default: ""
      providers:
        description: 可用的 AI 服務，空白分隔；標籤是 ai:<名稱>。claude 用 CLAUDE_CODE_OAUTH_TOKEN，agy 用本機登入的訂閱（需跑在 self-hosted runner）
        type: string
        default: claude agy
      models:
        description: Claude 可用的模型，空白分隔；model:<名稱> 標籤在此清單找；兩個都加時用前面的
        type: string
        default: claude-sonnet-5-5 claude-opus-5-5
      agy_models:
        description: agy 可用的模型，空白分隔；model:<名稱> 標籤在此清單找；兩個都加時用前面的
        type: string
        default: gemini-3.8-flash gemini-2.5-pro
      agy_default_effort:
        description: agy 預設的思考力道（low / medium / high / xhigh）；可用 effort:<值> 標籤或留言 --effort <值> 覆蓋
        type: string
        default: medium
      max_turns:
        type: number
        default: 80
      timeout_minutes:
        description: 開發 job 的時間上限
        type: number
        default: 45
      claude_timeout_minutes:
        description: Claude／agy 步驟的時間上限，要比 timeout_minutes 短（逾時時 job 還有時間發通知）
        type: number
        default: 35

env:
  # Claude 執行的指令（Bash）讀不到 AI 的 key 與 GitHub 換通行證用的 token；gh 用的 GH_TOKEN 不受影響
  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"

jobs:
  gate:
    # 三種叫醒方式：
    # 1. issue 被加上 ai:* 標籤
    # 2. 審查叫醒（workflow_dispatch，由呼叫端傳入 pr_number）
    # 3. 有權限的人在 issue／PR 留言 @claude 或 @agy（草稿 PR 不理）
    # 注意：「draft／idea 標籤不開工」的檢查在下面 decide 步驟的 checkIssueReady，不在這裡
    if: |
      (github.event_name == 'issues' &&
       startsWith(github.event.label.name, 'ai:')) ||
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@agy')) &&
       github.event.issue.draft != true &&
       github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-dev-gate-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    outputs:
      run: ${{ steps.decide.outputs.run }}
      provider: ${{ steps.ai.outputs.provider }}
      model: ${{ steps.ai.outputs.model }}
      env: ${{ steps.ai.outputs.env }}
      runs_on: ${{ steps.runs_on.outputs.value }}
      effort: ${{ steps.ai.outputs.effort }}
    steps:
      # 看 issue／PR 的標籤決定 AI 用哪家（ai:<服務>）、用哪個模型（model:<名稱>）。review.yml 呼叫同一個 composite action，改邏輯只改那邊
      # PR 一併看它要關閉的 issue（說明的 Closes #N）的標籤：開發 agent 開 PR 時不會把 issue 的標籤複製過去
      # 輸出：status（ok／missing／conflict／error）、provider、model、env（交給 Claude Code 的 KEY=VALUE）、summary
      - name: 看標籤決定 AI 服務與模型
        id: ai
        uses: bababo-ai/agent-flow/.github/actions/resolve-ai-provider@main
        with:
          github_token: ${{ github.token }}
          number: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
          providers: ${{ inputs.providers }}
          models: ${{ inputs.models }}
          agy_models: ${{ inputs.agy_models }}
          agy_default_effort: ${{ inputs.agy_default_effort }}
          comment_body: ${{ github.event.comment.body }}

      - name: 決定跑在哪個 runner
        id: runs_on
        env:
          PROVIDER: ${{ steps.ai.outputs.provider }}
          DEFAULT_RUNS_ON: ${{ inputs.runs_on }}
          AGY_RUNS_ON: ${{ inputs.agy_runs_on }}
        run: |
          if [ "$PROVIDER" = "agy" ]; then
            echo "value=$AGY_RUNS_ON" >> "$GITHUB_OUTPUT"
          else
            echo "value=$DEFAULT_RUNS_ON" >> "$GITHUB_OUTPUT"
          fi

      # 輸出：run（"true" 才會接著跑 work job）
      - name: 決定開不開工，條件不齊時通知
        id: decide
        uses: bababo-ai/agent-flow/.github/actions/dev-gate-decide@main
        with:
          github_token: ${{ github.token }}
          number: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
          status: ${{ steps.ai.outputs.status }}
          summary: ${{ steps.ai.outputs.summary }}
          providers: ${{ inputs.providers }}
          base_branch: ${{ inputs.base_branch }}
          is_pr: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # 開發 Agent（三種叫醒方式共用一個 job）：
  # - issue 開工：在 base 分支上，照 issue 開新分支、開 PR
  # - @claude / @agy 留言：PR 上的留言切到 PR 的分支修改；issue 上的留言照 issue 開新分支、開 PR
  # - 審查叫醒（workflow_dispatch）：切到 PR 的分支，照審查與測試的意見修改
  work:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ fromJSON(needs.gate.outputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: ai-dev-work-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      # 輸出：number、mode（issue／mention／review）、kind（issue／PR）、ref（PR 的分支）、sha（PR 開工前的 head commit）
      - name: 找出要改的分支與工作模式
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
          IS_PR: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const { GH_TOKEN, EVENT, NUMBER, IS_PR, GITHUB_REPOSITORY, GITHUB_OUTPUT } = process.env;
          const isPr = IS_PR === 'true';

          function setOutput(key, value) {
            fs.appendFileSync(GITHUB_OUTPUT, `${key}=${value}\n`);
          }

          let mode = 'mention';
          if (EVENT === 'issues') mode = 'issue';
          else if (EVENT === 'workflow_dispatch') mode = 'review';

          let ref = '';
          let sha = '';
          let kind = 'issue';

          if (isPr) {
            kind = 'PR';
            try {
              const res = execFileSync('gh', ['pr', 'view', NUMBER, '-R', GITHUB_REPOSITORY, '--json', 'headRefName,headRefOid'], {
                encoding: 'utf-8',
                env: { ...process.env, GH_TOKEN }
              });
              const pr = JSON.parse(res);
              ref = pr.headRefName || '';
              sha = pr.headRefOid || '';
            } catch (err) {
              console.error(`無法取得 PR #${NUMBER} 的分支資訊:`, err.message);
            }
          }

          setOutput('number', NUMBER);
          setOutput('mode', mode);
          setOutput('ref', ref);
          setOutput('sha', sha);
          setOutput('kind', kind);
          EOF

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # self-hosted runner 的工作目錄會保留上一次的內容，上一次留下的 pre-push hook
      # （綁著舊 PR 編號）會擋住這次的 push，所以不管這次是哪種模式都先清掉；
      # 是在改 PR 時再裝上 hook，push 前確認 PR 還是 OPEN
      - name: 設定推送前 PR 狀態檢查
        uses: bababo-ai/agent-flow/.github/actions/dev-setup-prepush-guard@main
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ steps.target.outputs.kind == 'PR' && steps.target.outputs.number || '' }}

      - name: 設定專案的環境變數
        if: inputs.extra_env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: printf '%s\n' "$EXTRA_ENV" | sed '/^[[:space:]]*$/d' >> "$GITHUB_ENV"

      - name: 準備專案（setup_command）
        if: inputs.setup_command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup_command }}
        run: bash -eo pipefail -c "$SETUP_COMMAND"

      # agy 跑在自己的 self-hosted runner（image 已內建 bubblewrap），不需要裝
      - name: 安裝隔離 Claude 指令用的 bubblewrap
        if: runner.os == 'Linux' && needs.gate.outputs.provider != 'agy'
        run: |
          if ! command -v bwrap > /dev/null || ! command -v socat > /dev/null; then
            for i in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
              echo "apt-get 第 $i 次失敗，重試"; sleep 5
            done
          fi
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: 設定 AI 服務與模型
        if: needs.gate.outputs.env != ''
        env:
          AI_ENV: ${{ needs.gate.outputs.env }}
        run: tr ' ' '\n' <<<"$AI_ENV" >> "$GITHUB_ENV"

      - name: 準備給開發 AI 的指示與評論
        id: prompt
        uses: bababo-ai/agent-flow/.github/actions/dev-build-prompt@main
        with:
          github_token: ${{ github.token }}
          github_repository: ${{ github.repository }}
          mode: ${{ steps.target.outputs.mode }}
          kind: ${{ steps.target.outputs.kind }}
          number: ${{ steps.target.outputs.number }}
          ref: ${{ steps.target.outputs.ref }}
          round: ${{ inputs.round }}
          base_branch: ${{ inputs.base_branch }}
          branch_prefix: ${{ inputs.branch_prefix }}
          comment_user: ${{ github.event.comment.user.login }}
          comment_body: ${{ github.event.comment.body }}
          project_instructions: ${{ inputs.project_instructions }}

      - id: claude
        if: needs.gate.outputs.provider != 'agy'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        timeout-minutes: ${{ inputs.claude_timeout_minutes }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          bot_name: "claude[bot]"
          bot_id: "209825114"
          show_full_output: ${{ github.event.repository.private }}
          allowed_bots: "github-actions"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checks:*)${{ inputs.allowed_tools != '' && format(',{0}', inputs.allowed_tools) || '' }}"

      - name: 印出 Claude 除錯日誌（失敗時）
        if: ${{ always() && steps.claude.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::group::Claude Code 除錯日誌"
          if [ -n "${{ steps.claude.outputs.execution_file }}" ] && [ -f "${{ steps.claude.outputs.execution_file }}" ]; then
            cat "${{ steps.claude.outputs.execution_file }}"
          else
            echo "找不到 execution_file: ${{ steps.claude.outputs.execution_file }}"
          fi
          echo "::endgroup::"

      - id: agy
        if: needs.gate.outputs.provider == 'agy'
        timeout-minutes: ${{ inputs.claude_timeout_minutes }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT_TEXT: ${{ steps.prompt.outputs.text }}
          MODEL: ${{ needs.gate.outputs.model }}
          EFFORT: ${{ needs.gate.outputs.effort }}
        run: |
          set -euo pipefail
          if ! command -v agy >/dev/null 2>&1; then
            echo "錯誤：在 Runner 上找不到 agy 指令。請確認 Self-hosted Runner 主機已安裝 agy 並登入訂閱帳號。" >&2
            exit 1
          fi

          git config user.name "agy[bot]"
          git config user.email "agy[bot]@users.noreply.github.com"
          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          echo "啟動 agy 執行開發任務..."
          agy_args=("-p" "$PROMPT_TEXT" "--dangerously-skip-permissions")
          if [ -n "$MODEL" ]; then
            agy_args+=("--model" "$MODEL")
          fi
          if [ -n "$EFFORT" ]; then
            agy_args+=("--effort" "$EFFORT")
          fi

          agy "${agy_args[@]}"

      # 通知時機：
      # - PR（審查叫醒、PR 上的留言）：AI 沒完成，或完成了但沒推新 commit（只回覆）
      # - issue（開工、issue 上的留言）：只在 AI 沒完成時通知；成功會開 PR，後面由審查流程接手通知
      - name: 開發沒完成或沒推新 commit 時通知
        if: ${{ always() && steps.target.outputs.number != '' }}
        uses: bababo-ai/agent-flow/.github/actions/dev-notify-outcome@main
        with:
          github_token: ${{ github.token }}
          kind: ${{ steps.target.outputs.kind }}
          number: ${{ steps.target.outputs.number }}
          before_sha: ${{ steps.target.outputs.sha }}
          provider: ${{ needs.gate.outputs.provider }}
          claude_outcome: ${{ steps.claude.outcome }}
          agy_outcome: ${{ steps.agy.outcome }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

      # =========================================================================
      # Self-hosted Runner 完整收尾清理（無論成功/失敗/取消必跑）
      # =========================================================================
      - name: 清理工作目錄（防 self-hosted runner 殘留）
        if: always()
        run: |
          echo "執行 self-hosted runner 工作目錄清理..."
          rm -f .git/hooks/pre-push
          git config --unset-all url."https://x-access-token:${{ github.token }}@github.com/".insteadOf 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
