name: AI Review & Test (Shared)

# 審查與測試的共用流程，由各專案的 .github/workflows/ai-review.yml（pull_request_target）用 workflow_call 呼叫。
# 觸發時機：PR 開啟（opened）、推送新 commit（synchronize）、或重新開啟（reopened）。
# 三個 Job：
# 1. gate：前置檢查（[skip ci]、Fork PR、PR 狀態、檔案/紀錄檔攔截）＋ AI 標籤解析，決定跑在哪個 runner
#    （provider 是 agy 時跑 agy_runs_on，通常是裝好 agy 的 self-hosted runner；否則跑 runs_on）
# 2. review：程式碼審查 → 測試驗證（選用）→ 留下逐行評論與總評留言；用 gate 決定的 runner 執行
# 3. notify：依結果發送 Telegram、更新 round 標籤叫醒開發 AI、或標記 Run 成功/失敗；無論 gate／review 結果如何都跑
#
# 複雜的 node 腳本邏輯拆到 .github/actions/review-*（composite action），這份 workflow 只保留步驟串接與條件判斷。

on:
  workflow_call:
    inputs:
      dev_workflow:
        description: 呼叫端的開發 workflow 檔名，審查或測試要修改時用 workflow_dispatch 叫醒它
        type: string
        default: ai-dev.yml
      runs_on:
        description: 執行環境（JSON），例如 "ubuntu-latest" 或 '["self-hosted"]'
        type: string
        default: '"ubuntu-latest"'
      review_runs_on:
        description: 相容舊設定：執行環境（JSON）
        type: string
        default: ""
      agy_runs_on:
        description: 當使用 agy 時跑在哪裡（JSON），需為安裝並登入 agy 的 self-hosted runner
        type: string
        default: '["self-hosted"]'
      timeout_minutes:
        description: 整個工作流程的時間上限（分鐘）
        type: number
        default: 40
      blocked_pattern:
        description: 固定檢查擋下的檔案（正規表示式，比對 PR 改到的檔案路徑）
        type: string
        default: '(^|/)(AGENTS|CLAUDE)\.md$|(^|/)\.claude/|^\.github/|(^|/)Dockerfile(\.[^/]*)?$|\.dockerfile$|(^|/)(docker-)?compose([-._][^/]*)?\.ya?ml$'
      blocked_extra:
        description: 另外要擋的檔案（接在 blocked_pattern 後面），例如套件清單
        type: string
        default: ""
      records_files:
        description: PR 不能改的紀錄檔（空白分隔、完整路徑），改到時照常審查、不測試
        type: string
        default: ""
      records_base:
        description: 紀錄檔檢查只看開到這個分支的 PR
        type: string
        default: develop
      records_exempt_prefix:
        description: 這個開頭的分支（例如發版分支）可以改紀錄檔
        type: string
        default: release/
      review_instructions:
        description: 專案自己的審查說明，加在審查提示詞後面
        type: string
        default: ""
      providers:
        description: 可用的 AI 服務，空白分隔；標籤是 ai:<名稱>
        type: string
        default: claude agy
      models:
        description: Claude 可用的模型，空白分隔
        type: string
        default: claude-opus-5-5 claude-sonnet-5-5
      agy_models:
        description: agy 可用的模型，空白分隔
        type: string
        default: gemini-3.8-flash gemini-2.5-pro
      agy_default_effort:
        description: agy 預設的思考力道（low / medium / high / xhigh）
        type: string
        default: medium
      review_max_turns:
        type: number
        default: 30
      max_rounds:
        description: 開發與審查、測試之間最多自動來回幾輪
        type: number
        default: 3
      # ---- 測試（選用）：test_setup 空的就不測試，審查通過就算通過 ----
      test_setup:
        description: 建立測試環境的腳本（呼叫端 base 分支裡的路徑，用 bash 執行）
        type: string
        default: ""
      test_prompt_file:
        description: 給測試 AI 的工具說明（Markdown 檔路徑）
        type: string
        default: ""
      test_allowed_tools:
        description: 放行給測試 AI 的工具，逗號分隔
        type: string
        default: ""
      smoke_script:
        description: 冒煙測試腳本（選用）
        type: string
        default: ""
      test_cleanup:
        description: 測完執行的清理腳本（選用）
        type: string
        default: ""
      test_artifacts:
        description: 測完上傳成 artifact 的檔案（例如截圖），空的就不上傳
        type: string
        default: ai-test-shots/*.png
      ci_workflow:
        description: 單元測試看哪個 CI workflow 的結果（例如 ci.yml），空的就不看
        type: string
        default: ""
      ci_step:
        description: CI 裡單元測試步驟名稱包含的文字
        type: string
        default: npm test
      test_max_turns:
        type: number
        default: 100

jobs:
  # =========================================================================
  # 1. 前置守衛：固定檢查、AI 標籤解析、決定跑在哪個 runner
  # =========================================================================
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      closed: ${{ steps.gate.outputs.closed }}
      blocked_files: ${{ steps.gate.outputs.blocked_files }}
      records_bad: ${{ steps.gate.outputs.records_bad }}
      guard_done: ${{ steps.gate.outputs.guard_done }}
      ai_status: ${{ steps.ai.outputs.status }}
      ai_summary: ${{ steps.ai.outputs.summary }}
      ai_provider: ${{ steps.ai.outputs.provider }}
      ai_model: ${{ steps.ai.outputs.model }}
      ai_effort: ${{ steps.ai.outputs.effort }}
      go: ${{ steps.decide.outputs.go }}
      runs_on: ${{ steps.runs_on.outputs.value }}
    steps:
      # 輸出：skip、closed、blocked_files、records_bad、guard_done
      - name: 前置檢查與設定
        id: gate
        uses: bababo-ai/agent-flow/.github/actions/review-gate-check@main
        with:
          github_token: ${{ github.token }}
          blocked_pattern: ${{ inputs.blocked_pattern }}
          blocked_extra: ${{ inputs.blocked_extra }}
          records_files: ${{ inputs.records_files }}
          records_base: ${{ inputs.records_base }}
          records_exempt_prefix: ${{ inputs.records_exempt_prefix }}

      # 解析 PR 與關聯 Issue 的標籤決定 AI 服務與模型；dev.yml 呼叫同一個 composite action，改邏輯只改那邊
      - name: 看標籤決定 AI 服務與模型
        id: ai
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.closed != 'true'
        uses: bababo-ai/agent-flow/.github/actions/resolve-ai-provider@main
        with:
          github_token: ${{ github.token }}
          number: ${{ github.event.pull_request.number }}
          providers: ${{ inputs.providers }}
          models: ${{ inputs.models }}
          agy_models: ${{ inputs.agy_models }}
          agy_default_effort: ${{ inputs.agy_default_effort }}

      # 若無攔截檔案且 AI 服務正常，放行審查
      - name: 決定是否放行審查
        id: decide
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.closed != 'true'
        env:
          BLOCKED_FILES: ${{ steps.gate.outputs.blocked_files }}
          AI_STATUS: ${{ steps.ai.outputs.status }}
        run: |
          if [ -z "$BLOCKED_FILES" ] && [ "$AI_STATUS" = "ok" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # provider 是 agy 時跑 agy_runs_on（需為裝好 agy 的 self-hosted runner），否則跑 runs_on／review_runs_on
      - name: 決定跑在哪個 runner
        id: runs_on
        env:
          PROVIDER: ${{ steps.ai.outputs.provider }}
          DEFAULT_RUNS_ON: ${{ inputs.review_runs_on != '' && inputs.review_runs_on || inputs.runs_on }}
          AGY_RUNS_ON: ${{ inputs.agy_runs_on }}
        run: |
          if [ "$PROVIDER" = "agy" ]; then
            echo "value=$AGY_RUNS_ON" >> "$GITHUB_OUTPUT"
          else
            echo "value=$DEFAULT_RUNS_ON" >> "$GITHUB_OUTPUT"
          fi

  # =========================================================================
  # 2. 程式碼審查（AI Review）與測試驗證
  # =========================================================================
  review:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ${{ fromJSON(needs.gate.outputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      review_verdict: ${{ steps.review_result.outputs.verdict }}
      test_verdict: ${{ steps.test_result.outputs.verdict }}
      smoke_result: ${{ steps.smoke.outputs.result }}
    steps:
      # self-hosted runner 主機不關機，執行前先清除可能殘留的舊目錄與檔案
      - name: 清除 self-hosted runner 殘留檔案（開頭清理）
        run: |
          rm -rf pr-head .ai-prev-review.md .ai-test-smoke.txt review-summary.md ai-test-shots
          rm -f .git/hooks/pre-push

      # 用 agy 時先確認 runner 上真的裝了 agy，免得 checkout／組 prompt 都做完才失敗
      - name: 確認 runner 已裝 agy
        if: needs.gate.outputs.ai_provider == 'agy'
        run: |
          if ! command -v agy >/dev/null 2>&1; then
            echo "::error::Runner 上找不到 agy 指令。請確認 Self-hosted Runner 主機已安裝 agy 並登入訂閱帳號。" >&2
            exit 1
          fi

      # =========================================================================
      # 程式碼取出（一次性取出 base 分支與 PR 變更，後續審查與測試共用）
      # =========================================================================
      - name: 取出 base 分支
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 取出 PR 的程式到 pr-head/
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      # 輸出：desc（給審查 AI 看的版本描述）
      - name: 找出上次審查的版本（複審用）
        id: prev
        continue-on-error: true
        uses: bababo-ai/agent-flow/.github/actions/review-find-prev-version@main
        with:
          github_token: ${{ github.token }}

      # agy 運作環境多已自備隔離；Claude 在 Linux runner 需 bubblewrap
      - name: 安裝隔離指令用的 bubblewrap
        if: runner.os == 'Linux' && needs.gate.outputs.ai_provider != 'agy'
        run: |
          if ! command -v bwrap > /dev/null || ! command -v socat > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat || true
          fi
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi

      # =========================================================================
      # 程式碼審查（AI Review）
      # =========================================================================
      - name: 準備給審查 AI 的指示
        id: review_prompt
        uses: bababo-ai/agent-flow/.github/actions/review-build-review-prompt@main
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          prev_desc: ${{ steps.prev.outputs.desc }}
          records_files: ${{ inputs.records_files }}
          records_exempt_prefix: ${{ inputs.records_exempt_prefix }}
          review_instructions: ${{ inputs.review_instructions }}

      - id: review_claude
        if: needs.gate.outputs.ai_provider != 'agy'
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        env:
          ANTHROPIC_MODEL: ${{ needs.gate.outputs.ai_model }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"
          github_token: ${{ github.token }}
          prompt: ${{ steps.review_prompt.outputs.text }}
          claude_args: |
            --add-dir pr-head
            --max-turns ${{ inputs.review_max_turns }}
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(git -C pr-head diff:*),Bash(git -C pr-head log:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","changes","suspicious"]},"high":{"type":"integer","minimum":0},"medium":{"type":"integer","minimum":0},"low":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["verdict","high","medium","low","summary"]}'

      - name: 印出 Claude 審查除錯日誌（失敗時）
        if: ${{ always() && steps.review_claude.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::group::Claude Code 審查除錯日誌"
          if [ -n "${{ steps.review_claude.outputs.execution_file }}" ] && [ -f "${{ steps.review_claude.outputs.execution_file }}" ]; then
            cat "${{ steps.review_claude.outputs.execution_file }}"
          else
            echo "找不到 execution_file: ${{ steps.review_claude.outputs.execution_file }}"
          fi
          echo "::endgroup::"

      - id: review_agy
        if: needs.gate.outputs.ai_provider == 'agy'
        uses: bababo-ai/agent-flow/.github/actions/review-run-agy@main
        with:
          github_token: ${{ github.token }}
          prompt_text: ${{ steps.review_prompt.outputs.text }}
          model: ${{ needs.gate.outputs.ai_model }}
          effort: ${{ needs.gate.outputs.ai_effort }}
          extra_args: --sandbox
          schema: '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","changes","suspicious"]},"high":{"type":"integer","minimum":0},"medium":{"type":"integer","minimum":0},"low":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["verdict","high","medium","low","summary"]}'

      # 輸出：verdict
      - id: review_result
        if: ${{ !cancelled() }}
        uses: bababo-ai/agent-flow/.github/actions/review-post-review-result@main
        with:
          github_token: ${{ github.token }}
          output: ${{ steps.review_claude.outputs.structured_output || steps.review_agy.outputs.structured_output }}

      # =========================================================================
      # 測試驗證（選用：審查通過且設有 test_setup 且無不可改紀錄檔時執行）
      # =========================================================================
      - name: 建立測試環境（test_setup）
        id: test_setup
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad }}
        continue-on-error: true
        env:
          TEST_SETUP: ${{ inputs.test_setup }}
        run: bash "$TEST_SETUP"

      # 輸出：result（none／pass／fail）
      - name: 冒煙測試
        id: smoke
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad }}
        uses: bababo-ai/agent-flow/.github/actions/review-run-smoke-test@main
        with:
          github_token: ${{ github.token }}
          smoke_script: ${{ inputs.smoke_script }}

      # 輸出：result、url
      - name: 等 CI 的單元測試結果
        id: unit
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad && inputs.ci_workflow != '' }}
        uses: bababo-ai/agent-flow/.github/actions/review-wait-ci-unit@main
        with:
          github_token: ${{ github.token }}
          ci_workflow: ${{ inputs.ci_workflow }}
          ci_step: ${{ inputs.ci_step }}

      - name: 準備給測試 AI 的指示
        id: test_prompt
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad }}
        uses: bababo-ai/agent-flow/.github/actions/review-build-test-prompt@main
        with:
          started: ${{ steps.test_setup.outputs.started }}
          setup_outcome: ${{ steps.test_setup.outcome }}
          setup_desc: ${{ steps.test_setup.outputs.desc }}
          test_prompt_file: ${{ inputs.test_prompt_file }}
          smoke_result: ${{ steps.smoke.outputs.result }}
          ci_workflow: ${{ inputs.ci_workflow }}
          unit_result: ${{ steps.unit.outputs.result }}
          unit_url: ${{ steps.unit.outputs.url }}

      - id: test_claude
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad && needs.gate.outputs.ai_provider != 'agy' }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        env:
          ANTHROPIC_MODEL: ${{ needs.gate.outputs.ai_model }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude"
          github_token: ${{ github.token }}
          prompt: ${{ steps.test_prompt.outputs.text }}
          claude_args: |
            --add-dir pr-head
            --max-turns ${{ inputs.test_max_turns }}
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh issue view:*)${{ inputs.test_allowed_tools != '' && format(',{0}', inputs.test_allowed_tools) || '' }}"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail","incomplete"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      - name: 印出 Claude 測試除錯日誌（失敗時）
        if: ${{ always() && steps.test_claude.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::group::Claude Code 測試除錯日誌"
          if [ -n "${{ steps.test_claude.outputs.execution_file }}" ] && [ -f "${{ steps.test_claude.outputs.execution_file }}" ]; then
            cat "${{ steps.test_claude.outputs.execution_file }}"
          else
            echo "找不到 execution_file: ${{ steps.test_claude.outputs.execution_file }}"
          fi
          echo "::endgroup::"

      - id: test_agy
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad && needs.gate.outputs.ai_provider == 'agy' }}
        uses: bababo-ai/agent-flow/.github/actions/review-run-agy@main
        with:
          github_token: ${{ github.token }}
          prompt_text: ${{ steps.test_prompt.outputs.text }}
          model: ${{ needs.gate.outputs.ai_model }}
          effort: ${{ needs.gate.outputs.ai_effort }}
          extra_args: --dangerously-skip-permissions
          schema: '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail","incomplete"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      # 輸出：verdict
      - id: test_result
        if: ${{ !cancelled() && inputs.test_setup != '' && steps.review_result.outputs.verdict == 'pass' && !needs.gate.outputs.records_bad }}
        uses: bababo-ai/agent-flow/.github/actions/review-post-test-result@main
        with:
          github_token: ${{ github.token }}
          smoke_result: ${{ steps.smoke.outputs.result }}
          output: ${{ steps.test_claude.outputs.structured_output || steps.test_agy.outputs.structured_output }}

      - name: 上傳測試產出
        if: ${{ !cancelled() && inputs.test_setup != '' && inputs.test_artifacts != '' && steps.review_result.outputs.verdict == 'pass' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-test-pr${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ inputs.test_artifacts }}
          retention-days: 3
          if-no-files-found: ignore

      - name: 清理測試環境（專案 test_cleanup）
        if: always() && inputs.test_setup != '' && inputs.test_cleanup != ''
        env:
          TEST_CLEANUP: ${{ inputs.test_cleanup }}
        run: bash "$TEST_CLEANUP" || true

      # =========================================================================
      # Self-hosted Runner 完整收尾清理（無論成功/失敗/取消必跑）
      # =========================================================================
      - name: 清理工作目錄（防 self-hosted runner 殘留）
        if: always()
        run: |
          echo "執行 self-hosted runner 工作目錄清理..."
          rm -rf pr-head .ai-prev-review.md .ai-test-smoke.txt review-summary.md ai-test-shots
          rm -f .git/hooks/pre-push
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

  # =========================================================================
  # 3. 綜合決策與通知（無論 gate／review 結果如何都跑）
  # =========================================================================
  notify:
    needs: [gate, review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 綜合決策與通知
        uses: bababo-ai/agent-flow/.github/actions/review-decide-notify@main
        with:
          github_token: ${{ github.token }}
          dev_workflow: ${{ inputs.dev_workflow }}
          max_rounds: ${{ inputs.max_rounds }}
          records_base: ${{ inputs.records_base }}
          records_exempt_prefix: ${{ inputs.records_exempt_prefix }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          test_enabled: ${{ inputs.test_setup != '' }}
          skip: ${{ needs.gate.outputs.skip }}
          closed: ${{ needs.gate.outputs.closed }}
          blocked_files: ${{ needs.gate.outputs.blocked_files }}
          records_bad: ${{ needs.gate.outputs.records_bad }}
          guard_done: ${{ needs.gate.outputs.guard_done }}
          ai_status: ${{ needs.gate.outputs.ai_status }}
          ai_summary: ${{ needs.gate.outputs.ai_summary }}
          review_verdict: ${{ needs.review.outputs.review_verdict }}
          test_verdict: ${{ needs.review.outputs.test_verdict }}
          smoke_result: ${{ needs.review.outputs.smoke_result }}
          job_status: ${{ needs.review.result }}
