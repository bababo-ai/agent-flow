name: AI Dev

# 開發 Claude：呼叫 __AI_DEV_FLOW_REPO__ 的共用流程（dev.yml）。三種叫醒方式：
# 1. 已規劃好的 issue（有 bug 或 feature 標籤、內文有「## 驗收條件」）加上 ai:claude 或 ai:agy 標籤 → 改程式、開 PR
# 2. 有寫入權限的人在 issue 或 PR 留言 @claude
# 3. 審查與測試判定要修改時，由 ai-review.yml 用 workflow_dispatch 叫醒（帶 PR 編號與第幾輪）
# 設定說明見 __AI_DEV_FLOW_REPO__ 的 README.md

# run 名稱：優先讀取 Issue 標題或 PR 標題，若無法讀取則優雅退回至 #編號
run-name: >-
  ${{
    github.event.issue.title ||
    github.event.pull_request.title ||
    inputs.title ||
    format('AI Dev #{0}', github.event.issue.number || github.event.pull_request.number || inputs.pr_number)
  }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要修改的 PR 編號
        required: true
        type: string
      round:
        description: 第幾輪修改
        required: true
        type: string
      title:
        description: 任務標題（選填）
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: ai-dev-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai:
    # 守門條件：
    # 1. 如果是 labeled 事件，必須是開工標籤 (ai: 開頭，如 ai:agy / ai:claude 等)
    # 2. 如果是 comment 事件，必須是真人留言且包含呼叫指令 (@claude / @agy)
    # 3. 如果是 workflow_dispatch 則照常允許
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'ai:')) ||
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@agy'))
      )
    # 用 commit 編號鎖定共用流程的版本；升級時改成新的 commit，先在一個專案試過再套到其他專案
    uses: __AI_DEV_FLOW_REPO__/.github/workflows/dev.yml@__AI_DEV_FLOW_REF__
    secrets: inherit
    with:
      pr_number: ${{ inputs.pr_number }}
      round: ${{ inputs.round }}
      # ↓ 依專案調整（全部選項與預設值見共用流程 dev.yml 開頭的 inputs）
      base_branch: develop
      # 可用的 AI 服務（標籤 ai:<名稱>）；支援 claude（Claude 訂閱）、agy（Antigravity 訂閱，需 self-hosted runner）或其他相容服務，見 docs/providers.md
      providers: claude agy
      # 執行環境：使用 agy 訂閱時請改為 '["self-hosted"]'（本機需預先安裝 agy 並登入）
      # runs_on: '["self-hosted"]'
      # Claude 啟動前先裝好套件（Claude 的指令有隔離，自己裝會失敗）
      setup_command: ""
      # 放行給開發 Claude 的建置、測試指令，例如 Bash(npm run build),Bash(npm test)
      allowed_tools: ""
      # 專案的建置與驗證方式、變更記錄寫法（會加在給開發 Claude 的指示後面）
      project_instructions: |
        改完照 AGENTS.md 的規則建置、驗證，並寫變更記錄。
